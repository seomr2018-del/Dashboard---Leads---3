name: Deploy to GitHub Pages

# בונה את האפליקציה ומפרסם את dist/ ל-GitHub Pages.
# ב-Settings → Pages צריך לבחור Source: "GitHub Actions" (לא "Deploy from a branch").
# האתר הציבורי עובד על נתוני דמה בלבד: אין בו טוקן של Airtable, ואסור להוסיף אותו כאן.

on:
  push:
    branches: [claude/busy-volta-pun871, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
